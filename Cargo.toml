[package]
name = "json-schema-subtyping"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
jsonc-parser = "0.29.0"
miette = { version = "7.6.0", features = ["fancy"] }
smallvec = "1"
