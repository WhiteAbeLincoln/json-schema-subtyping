[package]
name = "json-schema-subtyping"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonc-parser = { version = "0.29.0", optional = true }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.149", optional = true }
snafu = "0.8.9"

[features]
serde = ["dep:serde", "dep:serde_json"]
jsonc = ["dep:jsonc-parser"]

[dev-dependencies]
jsonschema = "0.38"
libtest-mimic = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[test]]
name = "test_suite"
harness = false
